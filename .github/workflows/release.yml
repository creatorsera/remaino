name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.7.0"
        required: true
        default: "v0.8.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.6.0"

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION_NAME=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      # Optional private keystore. Without the secret the build falls back to the
      # shared debug key, which still installs over the existing debug builds.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | sed 's/^data:[^,]*,//' \
            | tr -d '[:space:]' \
            | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a file. Re-copy it as one unbroken base64 line."
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Validate signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing keystore secrets:$missing"
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The decoded KEYSTORE_BASE64 is not a valid keystore, or KEYSTORE_PASSWORD/KEY_ALIAS do not match it."
            echo "Re-encode the file with: base64 -w0 your-release.jks"
            exit 1
          fi
          echo "Keystore OK: alias '$KEY_ALIAS' is readable."

      - name: Test and build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Rename APK and create checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "remino-${VERSION_NAME}.apk"
          sha256sum "remino-${VERSION_NAME}.apk" > "remino-${VERSION_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: Remino ${{ env.VERSION_NAME }}
          files: |
            remino-*.apk
            remino-*.apk.sha256
          generate_release_notes: true
