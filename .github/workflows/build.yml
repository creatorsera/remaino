name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # Installs this Gradle version, so the project builds even without a committed wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.6.0"

      - name: Lint and unit tests
        run: gradle lintDebug testDebugUnitTest --stacktrace

      # Debug builds are debuggable and signed with the public debug key, so CI
      # builds them but never publishes them as a downloadable artifact.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-reports
          path: app/build/reports/
